<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Report</title>

    <!-- Critical spinner styles (inlined so the spinner can paint before any external resource loads) -->
    <style>
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1em;
            background-color: rgba(255, 255, 255, 0.9);
            transition: opacity 0.4s ease;
        }

        .darkmode #loadingOverlay {
            background-color: rgba(29, 42, 53, 0.9);
        }

        #loadingOverlay.loading-done {
            opacity: 0;
            pointer-events: none;
        }

        #loadingOverlay.loading-error {
            background-color: rgba(255, 235, 238, 0.95);
            padding: 1em;
            box-sizing: border-box;
        }

        .darkmode #loadingOverlay.loading-error {
            background-color: rgba(46, 33, 36, 0.95);
        }

        #loadingOverlay .error-icon {
            font-size: 4em;
            color: #f44336;
        }

        #loadingOverlay .loading-text.error-text {
            font-size: 1.5em;
            color: #d32f2f;
        }

        .darkmode #loadingOverlay .loading-text.error-text {
            color: #ef9a9a;
        }

        #loadingOverlay .error-details {
            max-width: 90%;
            max-height: 50vh;
            overflow: auto;
            font-family: monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-break: break-word;
            color: #555;
        }

        .darkmode #loadingOverlay .error-details {
            color: #ccc;
        }

        #loadingOverlay .spinner {
            width: 4em;
            height: 4em;
            border: 0.4em solid rgba(96, 125, 139, 0.25);
            border-top-color: #607d8b;
            border-radius: 50%;
            animation: spinner-rotate 0.8s linear infinite;
        }

        #loadingOverlay .loading-text {
            font-size: 1.25em;
            color: #607d8b;
        }

        .darkmode #loadingOverlay .loading-text {
            color: #ddd;
        }

        @keyframes spinner-rotate {
            to { transform: rotate(360deg); }
        }
    </style>

    <!-- Load error handler (runs before the page scripts so it can catch their failures) -->
    <script>
        (function () {
            "use strict";
            var LOAD_TIMEOUT_MS = 20000; // watchdog: spinner still showing after this long
            var failed = false;

            function isStillLoading() {
                var overlay = document.getElementById('loadingOverlay');
                if (overlay) {
                    return !overlay.classList.contains('loading-done');
                }
                return !document.body; // body not parsed yet -> a head script failed
            }

            function showError(titleText, detailsText) {
                if (failed || !isStillLoading()) { return; }
                failed = true;

                var overlay = document.getElementById('loadingOverlay');
                if (!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = 'loadingOverlay';
                    (document.body || document.documentElement).appendChild(overlay);
                }
                overlay.classList.add('loading-error');
                overlay.textContent = ''; // remove spinner

                var icon = document.createElement('div');
                icon.className = 'mi error-icon';
                icon.textContent = 'error';

                var title = document.createElement('div');
                title.className = 'loading-text error-text';
                title.textContent = titleText;

                overlay.appendChild(icon);
                overlay.appendChild(title);

                if (detailsText) {
                    var details = document.createElement('div');
                    details.className = 'error-details';
                    details.textContent = detailsText;
                    overlay.appendChild(details);
                }
            }

            // Exposed so the resource loader at the bottom of the page can
            // surface failures the capture-phase listener ignores (e.g. CSS)
            window.smpgShowLoadError = showError;

            // Uncaught exceptions and failed resource loads (capture phase)
            window.addEventListener('error', function (event) {
                var target = event.target;
                if (target && target !== window) {
                    // Only failed scripts break the page; ignore images/fonts/etc.
                    // Loader-managed scripts are retried, and the loader reports their final failure.
                    if (target.tagName === 'SCRIPT' && target.src && !target.hasAttribute('data-smpg-loader')) {
                        showError('Failed to load a required script', target.src);
                    }
                    return;
                }
                if (event.message) {
                    var where = event.filename ? ' (' + event.filename + ':' + event.lineno + ')' : '';
                    showError('An error occurred while loading the report', event.message + where);
                }
            }, true);

            window.addEventListener('unhandledrejection', function (event) {
                var reason = event.reason;
                var message = (reason && reason.message) ? reason.message : String(reason);
                showError('An error occurred while loading the report', message);
            });

            // Watchdog: if the spinner is still up, let the user know it's taking a while
            setTimeout(function () {
                if (failed || !isStillLoading()) { return; }
                var overlay = document.getElementById('loadingOverlay');
                if (overlay) {
                    var warning = document.createElement('div');
                    warning.className = 'loading-text';
                    warning.textContent = 'Taking longer than expected...';
                    overlay.appendChild(warning);
                }
            }, LOAD_TIMEOUT_MS);
        })();
    </script>
</head>

<body class="w3-white sidebar-closed">
    <!-- Loading overlay: placed before the stylesheets/scripts below so it paints as early as possible -->
    <div id="loadingOverlay" class="capture-ignore">
        <div class="spinner"></div>
        <span id="loadingProgress" class="loading-text">Loading report...</span>
    </div>

    <!-- Stylesheets are loaded by the loader at the bottom of this page -->

    <div id="documentRoot">

        <div id="leftSidebar" class="w3-sidebar w3-bar-block w3-card-4 w3-animate-left">
            <header id="leftSidebarHeader" class="w3-container w3-card w3-blue-grey w3-padding-small">
                <span><button id="closeButton" class="mi w3-button w3-ripple w3-left" title="Close places menu" onclick="menuToggle()">close</button></span>
                <span class="place-list-title w3-center">Places</span>
            </header>
            <div class="w3-container w3-padding-small">
                <input id="placeSearch" class="w3-input w3-border" type="text" onkeyup="searchFunction()" onkeydown="confirmSearch(event)" autocomplete="off" placeholder="Search place">
                <ul id="placeList"></ul>
            </div>
        </div>

        <div id="main">
            <div id="contentRoot">
                <header id="contentHeader" class="w3-container w3-card w3-blue-grey">
                    <span><button id="menuButton" class="mi w3-button w3-ripple w3-left" title="Open places menu" onclick="menuToggle()">menu</button></span>
                    <span id="contentHeaderText"></span>
                    <div id="contentHeaderMenu" class="w3-right" title="Open menu"></div>
                </header>
                <div id="contentBody">
                    <div id="gridstackRoot" class="grid-stack">

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--
        Stylesheets and scripts are downloaded a few at a time (MAX_CONCURRENT_REQUESTS),
        to stay under the limit of servers with a limited number of concurrent
        connections, and applied and run in the order listed below. Keep the order:
        stylesheets first, then libraries -> data -> app -> main.
        When bundling files later, just replace the entries here.
    -->
    <script>
        (function () {
            "use strict";
            var stylesheetUrls = [
                // Library styles
                './css/libraryStyles/w3.css',
                './css/libraryStyles/billboard_modern.min.css',
                './css/libraryStyles/gridstack.min.css',
                './css/libraryStyles/tinymce/skins/ui/oxide/skin.min.css',
                // Custom styles
                './css/style.css',
                './css/map.css',
                './css/icons.css',
                './css/plots.css',
                './css/widgetCard.css',
                './css/floatingWidget.css'
            ];

            var scriptUrls = [
                // Libraries
                './js/libraries/lodash-4.17.21.min.js',
                './js/libraries/d3.v7.min.js',
                './js/libraries/billboard.min.js',
                './js/libraries/html2canvas.min.js',
                './js/libraries/topojson.v3.min.js',
                './js/libraries/pako.min.js',
                './js/libraries/gridstack-all.min.js',
                './js/libraries/interact.min.js',
                './js/libraries/showdown.min.js',
                // TinyMCE scripts
                './js/libraries/tinymce/tinymce.min.js',
                './js/libraries/tinymce/icons/default/icons.min.js',
                './js/libraries/tinymce/themes/silver/theme.min.js',
                './js/libraries/tinymce/models/dom/model.min.js',
                './js/libraries/tinymce/plugins/lists/plugin.min.js',
                './js/libraries/tinymce/plugins/link/plugin.min.js',
                './js/libraries/tinymce/plugins/table/plugin.min.js',
                './js/libraries/tinymce/plugins/code/plugin.min.js',
                './js/libraries/tinymce/plugins/quickbars/plugin.min.js',
                './js/libraries/tinymce/plugins/image/plugin.min.js',
                // Data
                './data/data.js',
                './data/layout.js',
                // SMPG scripts
                './js/utils.js',
                './js/makeDialogs.js',
                './js/bbPlotUtils.js',
                './js/widgetClasses.js',
                './js/makePlots.js',
                './js/makeMap.js',
                './js/makeTextEditor.js',
                './js/makeLinkDialog.js',
                './js/makePlaceBlocks.js',
                './js/makeTableOfContents.js',
                './js/htmlToCanvasExporter.js',
                './js/layoutInit.js',
                // Main
                './main.js'
            ];

            // Failed loads (e.g. HTTP 429 from rate-limited servers) are retried with
            // exponential backoff: 0.5s, 1s, 2s, 4s, 8s (+ up to 25% jitter), which stays
            // under the 20s "Taking longer than expected" watchdog.
            // <link>/<script> errors don't expose the HTTP status, so every failure is retried.
            // Retries ask for "file?retry=N": the browser reuses a failed preload for the same address.
            var MAX_RETRIES = 5;
            var BASE_DELAY_MS = 500;
            var retryStatus = null;
            var filesRetrying = 0; // the retry message stays until they've all loaded

            function showRetryStatus(text) {
                var overlay = document.getElementById('loadingOverlay');
                if (!overlay || overlay.classList.contains('loading-error')) { return; }
                if (!retryStatus) {
                    retryStatus = document.createElement('div');
                    retryStatus.className = 'loading-text';
                    overlay.appendChild(retryStatus);
                }
                retryStatus.textContent = text;
            }

            function clearRetryStatus() {
                if (retryStatus) {
                    retryStatus.remove();
                    retryStatus = null;
                }
            }

            // Over http, a failed load is followed by a HEAD request for its status, which the
            // <link>/<script> error doesn't give: a missing file (404, 410) isn't retried, and the
            // messages name the status. Pages opened from disk (file://) can't fetch: null.
            function probeStatus(url, callback) {
                if (!/^https?:$/.test(location.protocol) || !window.fetch) {
                    callback(null);
                    return;
                }
                fetch(url, { method: 'HEAD', cache: 'no-store' }).then(function (response) {
                    callback(response.status);
                }, function () {
                    callback(null);
                });
            }

            // The retry message's start, from the probe's status
            function describeRetry(status) {
                if (status === 429) { return 'Too many requests (HTTP 429).'; }
                if (status >= 500 && status !== 501) { return 'Server error (HTTP ' + status + ').'; }
                return 'Server side problem.';
            }

            // Added to the error's title, from the probe's status: nothing when it says nothing
            // (no status, the file is there, or HEAD isn't allowed)
            function describeFailure(status) {
                if (status === 404 || status === 410) { return ': not found (HTTP ' + status + ')'; }
                if (status === null || status < 400 || status === 405 || status === 501) { return ''; }
                return ' (HTTP ' + status + ')';
            }

            function loadWithRetry(insert, createElement, onLoad, onFinalError) {
                var attempt = 0;
                function tryLoad() {
                    var element = createElement(attempt);
                    element.setAttribute('data-smpg-loader', '');
                    element.onload = function () {
                        if (attempt > 0) {
                            filesRetrying -= 1;
                            if (filesRetrying === 0) { clearRetryStatus(); }
                        }
                        onLoad(element);
                    };
                    element.onerror = function () {
                        element.remove();
                        probeStatus(element.href || element.src, function (status) {
                            // A missing file won't appear on a retry
                            if (status === 404 || status === 410 || attempt >= MAX_RETRIES) {
                                clearRetryStatus();
                                onFinalError(element, describeFailure(status));
                                return;
                            }
                            var delay = BASE_DELAY_MS * Math.pow(2, attempt);
                            delay += Math.random() * delay * 0.25;
                            if (attempt === 0) { filesRetrying += 1; }
                            attempt += 1;
                            showRetryStatus(describeRetry(status) + ' Retrying (' + attempt + '/' + MAX_RETRIES + ')...');
                            setTimeout(tryLoad, delay);
                        });
                    };
                    insert(element);
                }
                tryLoad();
            }

            // Files are downloaded MAX_CONCURRENT_REQUESTS at a time, stylesheets first, each with the
            // retry above. Stylesheets apply as they arrive, each in its own place in <head>, so the
            // cascade keeps the listed order. Scripts are downloaded ahead with <link rel="preload">
            // and run one at a time in the listed order, once every stylesheet is in (the report's
            // code measures the styled page): each <script> tag reuses its preloaded copy. Without
            // preload support, scripts are only downloaded when their turn comes.
            var MAX_CONCURRENT_REQUESTS = 6; // keep it under the server's limit (20)
            var probe = document.createElement('link');
            var canPreload = !!(probe.relList && probe.relList.supports && probe.relList.supports('preload'));

            var styleFiles = stylesheetUrls.map(function (url) {
                // Keeps the stylesheet's place in <head>, also while it's retried
                var placeholder = document.createComment(' ' + url + ' ');
                document.head.appendChild(placeholder);
                return { url: url, isStyle: true, placeholder: placeholder, downloaded: false };
            });
            var scriptFiles = scriptUrls.map(function (url) {
                return { url: url, isStyle: false, downloaded: !canPreload };
            });

            function retryUrl(url, attempt) {
                return attempt > 0 ? url + '?retry=' + attempt : url;
            }
            var downloads = canPreload ? styleFiles.concat(scriptFiles) : styleFiles;

            var nextDownload = 0;
            var downloadsInFlight = 0;
            var stylesheetsLoaded = 0;

            // "Loading report... (N/M)": the stylesheets applied and the scripts run, of all files
            var progressText = document.getElementById('loadingProgress');
            function showProgress() {
                if (!progressText) { return; }
                progressText.textContent = 'Loading report... (' + (stylesheetsLoaded + nextScript) + '/'
                    + (styleFiles.length + scriptFiles.length) + ')';
            }

            function startDownloads() {
                while (downloadsInFlight < MAX_CONCURRENT_REQUESTS && nextDownload < downloads.length) {
                    download(downloads[nextDownload]);
                    nextDownload += 1;
                }
            }

            function download(file) {
                downloadsInFlight += 1;
                loadWithRetry(function (element) {
                    if (file.isStyle) {
                        file.placeholder.parentNode.insertBefore(element, file.placeholder);
                    } else {
                        document.head.appendChild(element);
                    }
                }, function (attempt) {
                    var link = document.createElement('link');
                    if (file.isStyle) {
                        link.rel = 'stylesheet';
                    } else {
                        link.rel = 'preload';
                        link.as = 'script';
                    }
                    link.href = retryUrl(file.url, attempt);
                    return link;
                }, function (link) {
                    downloadsInFlight -= 1;
                    file.downloaded = true;
                    // The script runs from the address that was downloaded
                    file.url = link.getAttribute('href');
                    if (file.isStyle) {
                        stylesheetsLoaded += 1;
                        showProgress();
                    }
                    startDownloads();
                    runNextScript();
                }, function (link, failure) {
                    window.smpgShowLoadError((file.isStyle ? 'Failed to load a required stylesheet'
                        : 'Failed to load a required script') + failure, link.href);
                });
            }

            var nextScript = 0;
            var scriptRunning = false;
            function runNextScript() {
                if (scriptRunning || stylesheetsLoaded < styleFiles.length) { return; }
                var file = scriptFiles[nextScript];
                if (!file || !file.downloaded) { return; }
                scriptRunning = true;
                loadWithRetry(function (element) {
                    document.body.appendChild(element);
                }, function (attempt) {
                    var script = document.createElement('script');
                    script.src = retryUrl(file.url, attempt);
                    return script;
                }, function () {
                    scriptRunning = false;
                    nextScript += 1;
                    showProgress();
                    runNextScript();
                }, function (script, failure) {
                    window.smpgShowLoadError('Failed to load a required script' + failure, script.src);
                });
            }

            showProgress();
            startDownloads();
        })();
    </script>
</body>

</html>
