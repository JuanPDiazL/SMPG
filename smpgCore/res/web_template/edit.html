<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SMPG Report Editor</title>
    <!-- Opens the report in edit mode, keeping any hash parameters (e.g. edit.html#place=40782) -->
    <script>
        const params = new URLSearchParams(location.hash.slice(1));
        params.set("edit_mode", "true");
        location.replace(`index.html#${params}`);
    </script>
</head>
<body>
    <p><a href="index.html#edit_mode=true">Open the report in edit mode</a></p>
</body>
</html>
